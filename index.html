<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>10 Finger Keyboard Practice</title>
  <style>
    :root {
      --bg: #0a0e14;
      --surface: #121820;
      --surface-2: #1a2230;
      --border: #2a3548;
      --text: #e6edf3;
      --text-muted: #7d8da6;
      --accent: #3dd6c6;
      --accent-dim: #2a9d8f;
      --correct: #3fb950;
      --incorrect: #f85149;
      --word-upcoming: #4a5568;
      --word-done: #3d5a4a;
      --glow: rgba(61, 214, 198, 0.15);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      font-family: "JetBrains Mono", "Fira Code", "Cascadia Code", "SF Mono", Consolas, monospace;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem 1.5rem;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -20%, var(--glow), transparent),
        radial-gradient(ellipse 60% 40% at 100% 100%, rgba(248, 81, 73, 0.06), transparent);
    }

    .container {
      width: 100%;
      max-width: 920px;
    }

    header {
      text-align: center;
      margin-bottom: 2.5rem;
    }

    header h1 {
      font-size: 1.5rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--text);
      margin-bottom: 0.35rem;
    }

    header p {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2.5rem;
      margin-bottom: 2rem;
    }

    .stat {
      text-align: center;
    }

    .stat-label {
      font-size: 0.65rem;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--text-muted);
      margin-bottom: 0.25rem;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      color: var(--accent);
      line-height: 1;
    }

    .stat-value.timer-warning {
      color: var(--incorrect);
      animation: pulse 0.6s ease-in-out infinite;
    }

    @keyframes pulse {
      50% { opacity: 0.7; }
    }

    .words-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.75rem 1.5rem;
      min-height: 120px;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      position: relative;
      overflow: hidden;
    }

    .words-panel::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--accent-dim), transparent);
      opacity: 0.5;
    }

    .words-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.65rem 1rem;
      line-height: 1.8;
      font-size: 1.25rem;
      user-select: none;
    }

    .word {
      display: inline-flex;
      border-radius: 4px;
      padding: 0.1rem 0.15rem;
      transition: opacity 0.2s;
    }

    .word.upcoming {
      color: var(--word-upcoming);
    }

    .word.current {
      background: var(--surface-2);
      outline: 1px solid var(--border);
      padding: 0.15rem 0.35rem;
    }

    .word.completed {
      color: var(--word-done);
      opacity: 0.55;
    }

    .word.completed.correct-word {
      color: var(--correct);
      opacity: 0.7;
    }

    .word.completed.wrong-word {
      color: var(--incorrect);
      opacity: 0.7;
      text-decoration: line-through;
      text-decoration-color: rgba(248, 81, 73, 0.5);
    }

    .char {
      display: inline-block;
      position: relative;
    }

    .char.correct {
      color: var(--correct);
    }

    .char.incorrect {
      color: var(--incorrect);
    }

    .char.cursor::after {
      content: "";
      position: absolute;
      left: 0;
      bottom: -2px;
      width: 100%;
      height: 2px;
      background: var(--accent);
      animation: blink 1s step-end infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    .input-area {
      position: relative;
      margin-bottom: 1rem;
    }

    #typeInput {
      width: 100%;
      padding: 0.9rem 1.1rem;
      font-family: inherit;
      font-size: 1rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    #typeInput:focus {
      border-color: var(--accent-dim);
      box-shadow: 0 0 0 3px var(--glow);
    }

    #typeInput:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    #typeInput::placeholder {
      color: var(--text-muted);
    }

    .hint {
      text-align: center;
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
    }

    .hint kbd {
      display: inline-block;
      padding: 0.15rem 0.45rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 4px;
      font-size: 0.68rem;
      color: var(--text);
    }

    /* Results overlay */
    .results {
      display: none;
      text-align: center;
      padding: 2.5rem 2rem;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 8px 40px rgba(0, 0, 0, 0.45);
      animation: fadeUp 0.4s ease-out;
    }

    .results.visible {
      display: block;
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .results h2 {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 1.75rem;
    }

    .score-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      margin-bottom: 2rem;
    }

    .score-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.5rem 1rem;
    }

    .score-card .label {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      margin-bottom: 0.5rem;
    }

    .score-card .value {
      font-size: 2.75rem;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
    }

    .score-card.wpm .value {
      color: var(--accent);
    }

    .score-card.accuracy .value {
      color: var(--correct);
    }

    .score-card .unit {
      font-size: 1rem;
      font-weight: 400;
      color: var(--text-muted);
      margin-left: 0.15rem;
    }

    .btn-restart {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.85rem 2rem;
      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--bg);
      background: linear-gradient(135deg, var(--accent), var(--accent-dim));
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
      box-shadow: 0 4px 16px rgba(61, 214, 198, 0.25);
    }

    .btn-restart:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 24px rgba(61, 214, 198, 0.35);
      filter: brightness(1.08);
    }

    .btn-restart:active {
      transform: translateY(0);
    }

    .game-area.ended .words-panel,
    .game-area.ended .input-area,
    .game-area.ended .hint,
    .game-area.ended .stats-bar {
      display: none;
    }

    .game-area.ended .results {
      display: block;
    }

    .waiting .stat-value#timerDisplay {
      color: var(--text-muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>10 Finger Keyboard Practice</h1>
      <p>Programming &amp; Cybersecurity terms · 60 saniye</p>
    </header>

    <div class="game-area waiting" id="gameArea">
      <div class="stats-bar">
        <div class="stat">
          <div class="stat-label">Time</div>
          <div class="stat-value" id="timerDisplay">60</div>
        </div>
        <div class="stat">
          <div class="stat-label">Word</div>
          <div class="stat-value" id="wordCountDisplay" style="color: var(--text-muted); font-size: 1.5rem;">0</div>
        </div>
      </div>

      <div class="words-panel">
        <div class="words-row" id="wordsRow"></div>
      </div>

      <div class="input-area">
        <input
          type="text"
          id="typeInput"
          autocomplete="off"
          autocorrect="off"
          autocapitalize="off"
          spellcheck="false"
          placeholder="İlk harfi yazarak başlayın…"
        />
      </div>
      <p class="hint">Kelimeyi bitirince <kbd>Space</kbd> ile onaylayın ve sonraki kelimeye geçin</p>

      <div class="results" id="results">
        <h2>Test Completed</h2>
        <div class="score-grid">
          <div class="score-card wpm">
            <div class="label">Dakikadaki Kelime Sayısı</div>
            <div class="value" id="finalWpm">0<span class="unit"> WPM</span></div>
          </div>
          <div class="score-card accuracy">
            <div class="label">Doğruluk Yüzdesi</div>
            <div class="value" id="finalAccuracy">0<span class="unit">%</span></div>
          </div>
        </div>
        <button type="button" class="btn-restart" id="btnRestart">↻ Restart</button>
      </div>
    </div>
  </div>

  <script>
    const WORD_POOL = [
      "kernel", "exploit", "python", "cyber", "database", "script", "network",
      "firewall", "encryption", "token", "malware", "phishing", "ransomware",
      "vulnerability", "patch", "buffer", "overflow", "injection", "payload",
      "backdoor", "rootkit", "trojan", "botnet", "ddos", "ssl", "tls", "https",
      "proxy", "vpn", "subnet", "router", "switch", "packet", "protocol", "tcp",
      "udp", "dns", "dhcp", "api", "rest", "json", "xml", "docker", "kubernetes",
      "container", "virtual", "cloud", "aws", "azure", "linux", "windows", "macos",
      "terminal", "shell", "bash", "compiler", "debugger", "algorithm", "function",
      "variable", "array", "object", "class", "method", "interface", "module",
      "import", "export", "async", "await", "promise", "callback", "thread",
      "process", "memory", "cache", "stack", "heap", "pointer", "binary", "hex",
      "hash", "sha256", "aes", "rsa", "certificate", "keypair", "oauth", "jwt",
      "session", "cookie", "header", "request", "response", "endpoint", "server",
      "client", "frontend", "backend", "fullstack", "react", "node", "express",
      "mongodb", "postgres", "redis", "nginx", "apache", "git", "commit", "branch",
      "merge", "deploy", "pipeline", "ci", "cd", "devops", "agile", "scrum",
      "blockchain", "bitcoin", "ethereum", "smart", "contract", "nft", "mining",
      "neural", "machine", "learning", "tensorflow", "pytorch", "dataset", "model",
      "training", "inference", "gpu", "cpu", "ram", "ssd", "nvme", "bios", "uefi",
      "firmware", "driver", "registry", "syscall", "interrupt", "scheduler",
      "mutex", "semaphore", "deadlock", "race", "condition", "sandbox", "honeypot",
      "siem", "soc", "incident", "forensic", "artifact", "ioc", "threat", "intel",
      "zero", "day", "pentest", "recon", "enumeration", "escalation", "privilege",
      "lateral", "movement", "persistence", "exfiltration", "c2", "beacon", "stager",
      "obfuscation", "packer", "unpack", "disasm", "reverse", "engineering",
      "wireshark", "nmap", "metasploit", "burp", "sqlmap", "hydra", "john", "hashcat"
    ];

    const GAME_DURATION = 60;
    const VISIBLE_WORDS = 12;

    let words = [];
    let currentIndex = 0;
    let typed = "";
    let timerStarted = false;
    let timeLeft = GAME_DURATION;
    let timerId = null;
    let gameEnded = false;

    let correctChars = 0;
    let incorrectChars = 0;
    let completedWords = 0;
    let correctWords = 0;
    let wordResults = [];

    const gameArea = document.getElementById("gameArea");
    const wordsRow = document.getElementById("wordsRow");
    const typeInput = document.getElementById("typeInput");
    const timerDisplay = document.getElementById("timerDisplay");
    const wordCountDisplay = document.getElementById("wordCountDisplay");
    const results = document.getElementById("results");
    const finalWpm = document.getElementById("finalWpm");
    const finalAccuracy = document.getElementById("finalAccuracy");
    const btnRestart = document.getElementById("btnRestart");

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function pickWords(count) {
      const picked = [];
      const pool = shuffle(WORD_POOL);
      for (let i = 0; i < count; i++) {
        picked.push(pool[i % pool.length]);
      }
      return picked;
    }

    function initGame() {
      words = pickWords(80);
      currentIndex = 0;
      typed = "";
      timerStarted = false;
      timeLeft = GAME_DURATION;
      gameEnded = false;
      correctChars = 0;
      incorrectChars = 0;
      completedWords = 0;
      correctWords = 0;
      wordResults = [];

      gameArea.classList.remove("ended", "waiting");
      gameArea.classList.add("waiting");
      results.classList.remove("visible");

      timerDisplay.textContent = String(GAME_DURATION);
      timerDisplay.classList.remove("timer-warning");
      wordCountDisplay.textContent = "0";
      wordCountDisplay.style.color = "var(--text-muted)";
      wordCountDisplay.style.fontSize = "1.5rem";

      typeInput.value = "";
      typeInput.disabled = false;
      typeInput.placeholder = "İlk harfi yazarak başlayın…";

      renderWords();
      typeInput.focus();
    }

    function renderWords() {
      wordsRow.innerHTML = "";
      const start = Math.max(0, currentIndex - 2);
      const end = Math.min(words.length, currentIndex + VISIBLE_WORDS);

      for (let i = start; i < end; i++) {
        const wordEl = document.createElement("span");
        wordEl.className = "word";
        const target = words[i];

        if (i < currentIndex) {
          wordEl.classList.add("completed");
          if (wordResults[i]) {
            wordEl.classList.add("correct-word");
          } else {
            wordEl.classList.add("wrong-word");
          }
          wordEl.textContent = target;
        } else if (i === currentIndex) {
          wordEl.classList.add("current");
          for (let c = 0; c < target.length; c++) {
            const charEl = document.createElement("span");
            charEl.className = "char";
            if (c < typed.length) {
              charEl.textContent = typed[c];
              charEl.classList.add(typed[c] === target[c] ? "correct" : "incorrect");
            } else if (c === typed.length) {
              charEl.textContent = target[c];
              charEl.classList.add("cursor");
            } else {
              charEl.textContent = target[c];
            }
            wordEl.appendChild(charEl);
          }
          if (typed.length > target.length) {
            for (let c = target.length; c < typed.length; c++) {
              const charEl = document.createElement("span");
              charEl.className = "char incorrect";
              charEl.textContent = typed[c];
              wordEl.appendChild(charEl);
            }
          }
        } else {
          wordEl.classList.add("upcoming");
          wordEl.textContent = target;
        }

        wordsRow.appendChild(wordEl);
      }
    }

    function startTimer() {
      if (timerStarted) return;
      timerStarted = true;
      gameArea.classList.remove("waiting");

      timerId = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = String(timeLeft);
        if (timeLeft <= 10) {
          timerDisplay.classList.add("timer-warning");
        }
        if (timeLeft <= 0) {
          endGame();
        }
      }, 1000);
    }

    function endGame() {
      if (gameEnded) return;
      gameEnded = true;
      clearInterval(timerId);
      typeInput.disabled = true;

      const totalChars = correctChars + incorrectChars;
      const accuracy = totalChars > 0
        ? Math.round((correctChars / totalChars) * 100)
        : 0;

      const elapsedMinutes = GAME_DURATION / 60;
      const wpm = Math.round(correctWords / elapsedMinutes);

      finalWpm.innerHTML = `${wpm}<span class="unit"> WPM</span>`;
      finalAccuracy.innerHTML = `${accuracy}<span class="unit">%</span>`;

      gameArea.classList.add("ended");
      results.classList.add("visible");
    }

    function confirmWord() {
      if (gameEnded) return;
      const target = words[currentIndex];
      const isCorrect = typed === target;

      wordResults[currentIndex] = isCorrect;
      completedWords++;
      if (isCorrect) correctWords++;

      wordCountDisplay.textContent = String(correctWords);
      wordCountDisplay.style.color = "var(--accent)";
      wordCountDisplay.style.fontSize = "2rem";

      typed = "";
      currentIndex++;

      if (currentIndex >= words.length) {
        words.push(...pickWords(30));
      }

      renderWords();
    }

    typeInput.addEventListener("keydown", (e) => {
      if (gameEnded) {
        e.preventDefault();
        return;
      }

      if (e.key === " " || e.code === "Space") {
        e.preventDefault();
        if (!timerStarted && typed.length === 0) return;
        if (!timerStarted) startTimer();
        confirmWord();
        return;
      }

      if (e.key === "Backspace") {
        if (!timerStarted && typed.length <= 1) return;
        e.preventDefault();
        if (typed.length > 0) {
          const target = words[currentIndex];
          const idx = typed.length - 1;
          if (typed[idx] === target[idx]) {
            correctChars = Math.max(0, correctChars - 1);
          } else {
            incorrectChars = Math.max(0, incorrectChars - 1);
          }
          typed = typed.slice(0, -1);
          typeInput.value = typed;
          renderWords();
        }
        return;
      }

      if (e.key.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) {
        if (!timerStarted) startTimer();

        const char = e.key;
        e.preventDefault();

        const target = words[currentIndex];
        const idx = typed.length;

        if (char === target[idx]) {
          correctChars++;
        } else {
          incorrectChars++;
        }

        typed += char;
        typeInput.value = typed;
        renderWords();
      }
    });

    typeInput.addEventListener("input", (e) => {
      e.preventDefault();
      typeInput.value = typed;
    });

    typeInput.addEventListener("paste", (e) => e.preventDefault());

    btnRestart.addEventListener("click", initGame);

    initGame();
  </script>
</body>
</html>
